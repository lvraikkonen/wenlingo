[project]
name = "wenlingo-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlmodel",
  "psycopg[binary]",
  "alembic",
  "pydantic-settings",
  "python-dotenv",
  "httpx",
  "psycopg2-binary>=2.9.12",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "no_test_auth_settings: do not inject auth test environment defaults",
]

[tool.ruff]
line-length = 100
target-version = "py312"
